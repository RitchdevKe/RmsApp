    <style>
      :root {
        --header-height: 68px; /* pill top bar height; flush to top, no transparent gap */
        --sidebar-width: 200px;
        --primary-color: #9D1F15;
        --secondary-color: #F39C2A;
        --sidebar-bg: transparent;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #F8F9FA;
        overflow-x: hidden;
      }

      /* --- Layout Engine --- */
      
      .app-layout {
        /* Changed from flex to block to prevent vertical alignment issues */
        display: block;
        min-height: 100vh;
        position: relative;
      }

      /* Header is fixed */
      .app-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--header-height);
        z-index: 50;
      }

      /* Sidebar — transparent shell; pill styling lives inside the React component */
      .app-sidebar {
        position: fixed;
        top: var(--header-height);
        left: 0;
        bottom: 0;
        width: var(--sidebar-width);
        background-color: transparent;
        z-index: 40;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
      }

      /* Main Content Area */
      .app-main {
        /* Use padding instead of margin to ensure background continuity and avoid collapse */
        padding-top: calc(var(--header-height) + 1.5rem); 
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        padding-bottom: 1.5rem;
        background-color: #F8F9FA;
        min-height: 100vh;
        transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        box-sizing: border-box; 
      }

      /* --- Unified Layout Logic (Desktop) --- */
      
      /* Sidebar Open: Push content right and resize */
      [data-sidebar-open="true"] .app-sidebar {
        transform: translateX(0);
      }
      [data-sidebar-open="true"] .app-main {
        margin-left: var(--sidebar-width);
        width: calc(100% - var(--sidebar-width));
      }

      /* Sidebar Closed: Full width content */
      [data-sidebar-open="false"] .app-sidebar {
        transform: translateX(-100%);
      }
      [data-sidebar-open="false"] .app-main {
        margin-left: 0;
        width: 100%;
      }

      /* --- Mobile Responsive Overrides --- */
      @media (max-width: 1024px) {
        .app-sidebar {
            z-index: 60 !important; /* Force above header backdrop */
            box-shadow: 5px 0 25px rgba(0,0,0,0.2);
        }

        /* Glass Backdrop for mobile menu */
        .glass-backdrop {
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
      }

      /* --- Secondary Colored Scrollbar (Sidebar) --- */
      .sidebar-nav-scroll {
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--secondary-color) transparent;
      }

      .sidebar-nav-scroll::-webkit-scrollbar {
        width: 8px;
      }

      .sidebar-nav-scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .sidebar-nav-scroll::-webkit-scrollbar-thumb {
        background-color: var(--secondary-color); /* Secondary Color */
        border-radius: 10px;
        border: 2px solid var(--sidebar-bg); /* Creates padding effect against background */
      }

      .sidebar-nav-scroll::-webkit-scrollbar-thumb:hover {
        background-color: #D6861E; /* Secondary Dark */
      }
    </style>
